version: "3.3"
volumes:
    postgres:
    redis:

services:
  api:
    build: .
    restart: always
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
    ports:
      - "8000:8000"
    env_file:
      - env_file
    volumes:
      - "./nltk_data:/root/nltk_data"
    logging:
      driver: gelf
      options:
        gelf-address: "udp://0.0.0.0:12201"
    environment:
      BASE_URL: http://0.0.0.0:8000
