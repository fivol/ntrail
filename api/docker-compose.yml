version: "3.3"
volumes:
    postgres:
services:
  api:
    build: .
    restart: always
    ports:
      - "8000:8000"
    depends_on:
      - redis
    env_file:
      - env_file
    logging:
      driver: gelf
      options:
        gelf-address: "tcp://0.0.0.0:12201"

  redis:
    build: redis
    restart: always
    ports:
      - "6379:6379"

