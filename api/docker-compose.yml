version: "3.3"
volumes:
    postgres:
    redis:

services:
  api:
    build: .
    restart: always
    ports:
      - "8000:8000"
#    depends_on:
#      - redis
    env_file:
      - env_file
    volumes:
      - "./nltk_data:/root/nltk_data"
#      - ".:/app"
    logging:
      driver: gelf
      options:
        gelf-address: "udp://0.0.0.0:12201"
    environment:
      BASE_URL: http://0.0.0.0:8000

  redis:
    build: redis
    restart: always
    volumes:
      - redis:/usr/local/etc/redis
    ports:
      - "6379:6379"


