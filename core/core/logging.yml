version: 1
formatters:
  default:
    format: '%(asctime)s %(levelname)-8s %(name)-15s %(message)s'
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: default
    stream: ext://sys.stdout
loggers:
  vk:
    level: DEBUG
  "pymorphy2.opencorpora_dict.wrapper":
    level: WARNING
root:
  level: INFO
  handlers: [console]