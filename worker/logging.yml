version: 1
formatters:
  default:
    format: '%(asctime)s %(levelname)-8s %(name)-15s %(message)s'
handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: default
    stream: ext://sys.stdout
loggers:
  vk:
    level: DEBUG
  cache:
    level: DEBUG
  session:
    level: DEBUG
root:
  level: DEBUG
  handlers: [console]