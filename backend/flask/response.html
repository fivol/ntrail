\u043d\u0431\u0443\u0440\u0433\u00bb \u0438 \u00ab\u0421\u043f\u0430\u0440\u0442\u0430\u043a\u00bb \u0441\u043a\u0438\u043d\u0443\u043b\u0438\u0441\u044c \u0438 \u043f\u0440\u0438\u0432\u0435\u0437\u043b\u0438 \u0435\u0433\u043e \u0432 \u041c\u043e\u0441\u043a\u0432\u0443. \n\u0412\u0430\u043b\u0435\u043d\u0442\u0438\u043d \u041d\u0438\u043a\u043e\u043b\u0430\u0435\u0432\u0438\u0447 \u0443\u0432\u0438\u0434\u0435\u043b \u041a\u0440\u0430\u0441\u043d\u0443\u044e \u043f\u043b\u043e\u0449\u0430\u0434\u044c, \u0441\u043f\u0430\u0440\u0442\u0430\u043a\u043e\u0432\u0441\u043a\u0438\u0439 \u043c\u0443\u0437\u0435\u0439 \u0438 \u0441\u0430\u043c \u043c\u0430\u0442\u0447 \u0432 \u043c\u0430\u043a\u0441\u0438\u043c\u0430\u043b\u044c\u043d\u043e\u043c \u043f\u0440\u0438\u0431\u043b\u0438\u0436\u0435\u043d\u0438\u0438. \u041d\u0430 @sportsru \u0435\u0441\u0442\u044c \u0431\u043e\u043b\u044c\u0448\u043e\u0439 \u0442\u0435\u043a\u0441\u0442 \u043f\u0440\u043e \u044d\u0442\u043e, \u0431\u0443\u0434\u0435\u0442 \u0432\u0440\u0435\u043c\u044f - \u043f\u043e\u0447\u0438\u0442\u0430\u0439\u0442\u0435. \n\u0412\u043e\u0442 \u0434\u0432\u0430 \u043e\u0442\u0440\u044b\u0432\u043a\u0430. \n\u041f\u0415\u0420\u0412\u042b\u0419 (\u044d\u0442\u043e \u0446\u0438\u0442\u0430\u0442\u0430 \u0412\u0430\u043b\u0435\u043d\u0442\u0438\u043d\u0430 \u041b\u0435\u043e\u043d\u043e\u0432\u0430):\n\u00ab\u041c\u044b \u043f\u0440\u0438\u043b\u0435\u0442\u0435\u043b\u0438 \u0432\u0435\u0447\u0435\u0440\u043e\u043c \u0437\u0430 \u0434\u0435\u043d\u044c \u0434\u043e \u0438\u0433\u0440\u044b, \u0437\u0430\u0441\u0435\u043b\u0438\u043b\u0438\u0441\u044c \u0432 \u043e\u0442\u0435\u043b\u044c Hilton. Hilton, \u0434\u0430? \u0422\u0430\u043c \u0432\u043e\u043e\u0431\u0449\u0435! \u0416\u0438\u0432\u0443\u0442 \u043f\u043e \u043e\u0434\u043d\u043e\u043c\u0443 \u0447\u0435\u043b\u043e\u0432\u0435\u043a\u0443, \u043a\u0440\u043e\u0432\u0430\u0442\u044c \u2013 \u0447\u0435\u0442\u0432\u0435\u0440\u043e \u0441\u043f\u0430\u0442\u044c \u043c\u043e\u0433\u0443\u0442, \u0447\u0435\u0442\u044b\u0440\u0435 \u043f\u043e\u0434\u0443\u0448\u043a\u0438, \u0434\u0432\u0430 \u0442\u0435\u043b\u0435\u0444\u043e\u043d\u0430, \u0442\u0435\u043b\u0435\u0432\u0438\u0437\u043e\u0440, \u0434\u0432\u0430 \u0440\u0430\u0437\u0430 \u043c\u044b\u043b\u0441\u044f \u0432 \u0432\u0430\u043d\u043d\u043e\u0439. \u041f\u043e\u043b\u0443\u0447\u0438\u043b \u0443\u0434\u043e\u0432\u043e\u043b\u044c\u0441\u0442\u0432\u0438\u0435. \u041f\u043e\u0442\u043e\u043c \u043f\u043e\u0448\u0435\u043b \u0437\u0430\u0432\u0442\u0440\u0430\u043a\u0430\u0442\u044c, \u0430 \u043c\u043d\u0435 \u0433\u043e\u0432\u043e\u0440\u044f\u0442: \u00ab\u0411\u0435\u0440\u0438, \u0431\u0435\u0441\u043f\u043b\u0430\u0442\u043d\u043e, \u0432\u0441\u0435 \u043e\u043f\u043b\u0430\u0447\u0435\u043d\u043e\u00bb. \u042f \u043d\u0430\u0431\u0440\u0430\u043b \u0431\u043b\u044e\u0434 \u0438 \u0441\u0444\u043e\u0442\u043e\u0433\u0440\u0430\u0444\u0438\u0440\u043e\u0432\u0430\u043b, \u0437\u043d\u0430\u0435\u0442\u0435? \u0427\u0442\u043e\u0431\u044b \u043f\u043e\u043a\u0430\u0437\u0430\u0442\u044c, \u043a\u0430\u043a\u0438\u0435 \u0440\u0430\u0437\u043d\u044b\u0435 \u0431\u043b\u044e\u0434\u0430 \u0431\u044b\u0432\u0430\u044e\u0442. \u0422\u0430\u043c \u0441\u0442\u043e \u0431\u043b\u044e\u0434! \u041c\u043e\u0436\u043d\u043e \u043b\u044e\u0431\u043e\u0435. \u042f \u043f\u043e\u043b\u043e\u0436\u0438\u043b \u0432 \u0442\u0430\u0440\u0435\u043b\u043a\u0443 \u0434\u0432\u0430 \u0441\u043e\u0440\u0442\u0430 \u0441\u043e\u0441\u0438\u0441\u043e\u043a, \u0434\u0432\u0430 \u0441\u043e\u0440\u0442\u0430 \u0431\u0443\u0436\u0435\u043d\u0438\u043d\u044b, \u0434\u0440\u0443\u0433\u043e\u0435 \u0442\u0430\u043c, \u043a\u0440\u0430\u0441\u043d\u0443\u044e \u0440\u044b\u0431\u0443. \u041d\u0435 \u0432\u0441\u0435 \u0441\u044a\u0435\u043b \u2013 \u0438\u0437\u0432\u0438\u043d\u0438, \u0431\u043e\u0436\u0435\u043d\u044c\u043a\u0430, \u2013 \u043d\u043e \u0441\u043d\u043e\u0432\u0430 \u0441\u0444\u043e\u0442\u043e\u0433\u0440\u0430\u0444\u0438\u0440\u043e\u0432\u0430\u043b \u0442\u043e, \u0447\u0442\u043e \u043e\u0441\u0442\u0430\u043b\u043e\u0441\u044c. \u041e\u043a\u0430\u0437\u044b\u0432\u0430\u0435\u0442\u0441\u044f, \u043a\u043e\u0433\u0434\u0430 \u0437\u0430\u043f\u043b\u0430\u0447\u0435\u043d\u043e, \u043c\u043e\u0436\u043d\u043e \u0431\u0440\u0430\u0442\u044c \u0432\u0441\u0435, \u0447\u0442\u043e\u0431\u044b \u043d\u0430\u0435\u0441\u0442\u044c\u0441\u044f\u00bb.\n\u0412\u0422\u041e\u0420\u041e\u0419 \u041e\u0422\u0420\u042b\u0412\u041e\u041a (\u044d\u0442\u043e \u0436\u0443\u0440\u043d\u0430\u043b\u0438\u0441\u0442\u0441\u043a\u0438\u0439 \u0442\u0435\u043a\u0441\u0442):\n\u00ab\u041d\u0435\u0441\u043a\u043e\u043b\u044c\u043a\u043e \u0447\u0430\u0441\u043e\u0432 \u043f\u043e\u0441\u043b\u0435 \u0438\u0433\u0440\u044b. \u0410\u044d\u0440\u043e\u043f\u043e\u0440\u0442. \u0423\u043b\u044b\u0431\u0447\u0438\u0432\u044b\u0439 \u0441\u043e\u0441\u0442\u0430\u0432 \u00ab\u041e\u0440\u0435\u043d\u0431\u0443\u0440\u0433\u0430\u00bb. \u0420\u044f\u0434\u043e\u043c \u0441 \u0438\u0433\u0440\u043e\u043a\u0430\u043c\u0438 \u2013 \u0432\u0435\u0441\u044c \u043a\u0440\u0430\u0441\u043d\u043e-\u0431\u0435\u043b\u044b\u0439 \u0412\u0430\u043b\u0435\u043d\u0442\u0438\u043d \u041d\u0438\u043a\u043e\u043b\u0430\u0435\u0432\u0438\u0447. \u00ab\u041a\u0442\u043e-\u0442\u043e \u0438\u0437 \u0444\u0443\u0442\u0431\u043e\u043b\u0438\u0441\u0442\u043e\u0432 \u043f\u043e\u0448\u0443\u0442\u0438\u043b: \u00ab\u0421\u043f\u0430\u0441\u0438\u0431\u043e \u0434\u0435\u0434\u0443 \u0437\u0430 \u043f\u043e\u0431\u0435\u0434\u0443\u00bb, \u2013 \u043f\u043e\u0437\u0432\u043e\u043d\u0438\u043b \u043c\u043d\u0435 \u043d\u0430 \u0441\u043b\u0435\u0434\u0443\u044e\u0449\u0438\u0439 \u0434\u0435\u043d\u044c \u0412\u0430\u043b\u0435\u043d\u0442\u0438\u043d \u041d\u0438\u043a\u043e\u043b\u0430\u0435\u0432\u0438\u0447. \u2013 \u041a\u043e\u043c\u0430\u043d
