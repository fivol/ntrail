events {

}

http {
  server {
    listen 80;

    location / {
      proxy_pass http://web:5000;
    }
  }
  server {
    listen              443 ssl;
    server_name         vps783858.ovh.net;
    ssl_certificate /etc/nginx/certs/vps783858-ovh.net.crt;
    ssl_certificate_key /etc/nginx/certs/vps783858-ovh.net-privateKey.key;
    
    location / {
      proxy_pass http://web:5000;
    }
  }
}