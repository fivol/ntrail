events {

}

http {
  server {
    listen 80;

    location / {
      proxy_pass http://web:5000;
    }
    location /.well-known {
      root /var/www;
    }
  }
  server {
    listen              443 ssl;
    server_name         ntrail.fivol.space;
    # generated by certsbot instruction (https://certbot.eff.org/lets-encrypt/ubuntufocal-other)
    # see docker-compose.yaml mount paths
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    
    location / {
      proxy_pass http://web:5000;
    }
  }
}


