events {

}

http {
  server {
    listen 80;

    location / {
      proxy_pass http://web:5000;
    }
    location /.well-known {
      root /var/www;
    }
  }
  server {
    listen              443 ssl;
    server_name         fivol.site;
    ssl_certificate /etc/nginx/certs/certificate.crt;
    ssl_certificate_key /etc/nginx/certs/certificate.key;
    
    location / {
      proxy_pass http://web:5000;
    }
  }
}


