version: "3.1"

services:
  db:
    image: postgres
    restart: always
    env_file:
      - env_file
    ports:
      - 8888:5432

  web:
    build: ./flask
    restart: always
    env_file:
      - env_file
    ports:
      - 6050:5000
    depends_on:
      - db

  nginx:
    image: nginx
    restart: always
    ports:
      - 80:80
      - 443:443
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/certs:/etc/nginx/certs
      - ./nginx/data:/var/www
    depends_on:
      - web
