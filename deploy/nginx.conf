# NTrail: static frontend bundle, backend proxied under /api on the same origin.
# Copy to /etc/nginx/sites-available/ntrail.<domain> and symlink into sites-enabled.

server {
    listen 80;
    server_name ntrail.fiobond.me;

    root /var/www/ntrail;
    index index.html;

    # Create React App: every route falls back to the bundle.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
